name: RailSense AI CI/CD

on:
  push:
    branches: ["main", "develop", "fix/all-issues"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  # ─────────────────────────────────────────────────────────
  # Backend: lint + test (Python 3.11)
  # Uses SQLite in-memory so no Postgres/Redis service needed
  # ─────────────────────────────────────────────────────────
  backend-lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Lint — flake8 (syntax & undefined names only)
        run: |
          pip install flake8
          flake8 backend/app \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics \
            --max-line-length=120

      - name: Lint — isort (import order)
        run: |
          pip install isort
          isort --check-only --diff backend/app || true

      - name: Run pytest (SQLite in-memory)
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test_railsense.db
          SECRET_KEY: ci-test-secret-key-not-used-in-production
          OPENWEATHER_API_KEY: ""
          GEMINI_API_KEY: ""
          FAST2SMS_API_KEY: ""
        run: |
          cd backend
          pytest tests/ \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            -q

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml

  # ─────────────────────────────────────────────────────────
  # Frontend: lint + test + build (Node 18 & 20)
  # ─────────────────────────────────────────────────────────
  frontend-lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: ESLint
        run: |
          cd frontend
          npm run lint

      - name: Unit tests (Vitest)
        run: |
          cd frontend
          npm run test -- --run --reporter=verbose

      - name: Production build
        run: |
          cd frontend
          npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        if: matrix.node-version == '20.x'
        with:
          name: frontend-dist
          path: frontend/dist/

  # ─────────────────────────────────────────────────────────
  # Security audit (runs in parallel, non-blocking)
  # ─────────────────────────────────────────────────────────
  security-check:
    runs-on: ubuntu-latest
    needs: [backend-lint-and-test, frontend-lint-and-test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: pip-audit (Python dependencies)
        run: |
          pip install pip-audit
          cd backend
          pip install -r requirements.txt
          pip-audit || true

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm audit (JS dependencies)
        run: |
          cd frontend
          npm ci
          npm audit --audit-level=critical || true

  # ─────────────────────────────────────────────────────────
  # Summary notification
  # ─────────────────────────────────────────────────────────
  notify:
    needs: [backend-lint-and-test, frontend-lint-and-test, security-check]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Print pipeline summary
        run: |
          echo "================================================"
          echo "RailSense AI CI/CD Pipeline completed"
          echo "Backend tests : ${{ needs.backend-lint-and-test.result }}"
          echo "Frontend tests: ${{ needs.frontend-lint-and-test.result }}"
          echo "Security audit: ${{ needs.security-check.result }}"
          echo "================================================"
