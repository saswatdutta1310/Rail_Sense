name: RailSense AI CI/CD

on:
  push:
    branches: ["main", "develop", "fix/all-issues"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Backend: lint + test  (Python 3.11)
  # Tests use SQLite in-memory — no Postgres/Redis service required
  # ─────────────────────────────────────────────────────────────────────────────
  backend-lint-and-test:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Flake8 — syntax errors and undefined names
        run: |
          pip install flake8
          flake8 backend/app \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics \
            --max-line-length=120

      - name: Run pytest with coverage
        working-directory: backend
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./test_ci.db"
          SECRET_KEY: "ci-test-secret-key-railsense-2024"
          OPENWEATHER_API_KEY: ""
          GEMINI_API_KEY: ""
          FAST2SMS_API_KEY: ""
          NTES_BRIDGE_URL: "http://localhost:3001"
        run: |
          pytest tests/ \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            -q

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-py${{ matrix.python-version }}
          path: backend/coverage.xml

  # ─────────────────────────────────────────────────────────────────────────────
  # Frontend: lint + test + build
  # Vite 8 + Vitest 4 require Node >= 20.19 — Node 18 is NOT supported
  # ─────────────────────────────────────────────────────────────────────────────
  frontend-lint-and-test:
    name: Frontend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.x", "22.x"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Vitest unit tests
        working-directory: frontend
        run: npm run test -- --run --reporter=verbose

      - name: Production build
        working-directory: frontend
        run: npm run build

      - name: Upload build artifact
        if: matrix.node-version == '22.x'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  # ─────────────────────────────────────────────────────────────────────────────
  # Security audit (non-blocking — failures are reported but don't fail the PR)
  # ─────────────────────────────────────────────────────────────────────────────
  security-check:
    name: Security audit
    runs-on: ubuntu-latest
    needs: [backend-lint-and-test, frontend-lint-and-test]
    if: success() || failure()

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: pip-audit
        working-directory: backend
        run: |
          pip install pip-audit
          pip install -r requirements.txt
          pip-audit || true

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: npm audit
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=critical || true

  # ─────────────────────────────────────────────────────────────────────────────
  # Pipeline summary
  # ─────────────────────────────────────────────────────────────────────────────
  notify:
    name: Pipeline summary
    runs-on: ubuntu-latest
    needs: [backend-lint-and-test, frontend-lint-and-test, security-check]
    if: always()

    steps:
      - name: Print summary
        run: |
          echo "========================================"
          echo " RailSense AI — CI/CD Pipeline Summary"
          echo "========================================"
          echo " Backend tests : ${{ needs.backend-lint-and-test.result }}"
          echo " Frontend tests: ${{ needs.frontend-lint-and-test.result }}"
          echo " Security audit: ${{ needs.security-check.result }}"
          echo "========================================"
          if [ "${{ needs.backend-lint-and-test.result }}" = "failure" ] || \
             [ "${{ needs.frontend-lint-and-test.result }}" = "failure" ]; then
            echo "PIPELINE FAILED"
            exit 1
          fi
          echo "PIPELINE PASSED"
